<!DOCTYPE html>
<html>
<head>
    <title>Twitch Right Now : Login</title>
    <style>
        html, body {
            margin: 0;
            padding-top: 25px;
            background-color: #3b323f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: white;
            font-size: 30px;
        }
    </style>
    <script>
        const brw = window.chrome ? window.chrome : window.browser;

        var ttvRightNowID = 'jaebeaoffbboingfjbdkgbnnfdkjilld';
        var twitchToken = 'none';

        function messageExtention() {
            brw.runtime.sendMessage(ttvRightNowID, {
                requestType: 'setTtvToken',
                ttvToken: getHashParameters('access_token'),
            }).then((res) => {
                console.log('Response :', res);
                if (res && res.status) {
                    if (res.status === 'success') {
                        document.getElementById('mainMessage').innerHTML = 'Successfully logged in !<br />You can close this tab.';
                        return;
                    } else if (res.status === 'update' && res.message) {
                        document.getElementById('mainMessage').innerHTML = res.message;
                        return;
                    }
                }
                document.getElementById('mainMessage').innerHTML = 'An issue occurred while communicating with the extension.<br />(' + res.status + ')';

            });
        }

        function getHashParameters(hashname) {
            var hashParams = new Map();

            window.location.hash.substr(1).split('&').forEach(function(element) {
                let newElem = element.split('=');
                hashParams.set(newElem[0], newElem[1]);
            });

            return (hashParams.get(hashname));
        }

        window.addEventListener('load', function() {
            messageExtention();
        });
    </script>
</head>
<body>
<div id="mainMessage">Please wait a few seconds...</div>
</body>
</html>
